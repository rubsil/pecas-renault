name = "pecas-renault"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "peca-troca-db"
database_id = "9ed67b74-11d7-4352-a0e4-5e286591cd2f"

[triggers]
# Duas expressões diferentes, o mesmo handler scheduled() distingue
# qual disparou via controller.cron (ver worker/src/index.ts).
#
# "0 4 1 1,5,9 *" -- dia 1 às 04:00 UTC, em Jan/Mai/Set (de 4 em 4
# meses). Só troca o refresh token do Gmail por um access token novo
# -- essa troca em si já conta como "uso" perante a Google, o que
# evita o refresh token expirar por 6 meses de inatividade (ver
# NOTES.md). Login normal de qualquer concessionário já faz o mesmo,
# isto é só uma rede de segurança para o caso de a plataforma ficar
# sem uso durante muito tempo.
#
# "0 */6 * * *" -- de 6 em 6 horas. Repõe a conta de demonstração ao
# estado inicial, caso alguém tenha entrado em modo demo e saído sem
# clicar em "Sair" (que já dispara o mesmo reset de imediato) -- rede
# de segurança para quem fecha o browser sem terminar sessão.
crons = ["0 4 1 1,5,9 *", "0 */6 * * *"]
